<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Generated by build.py from templates/index.html and catalog.yml: edit those, not _site/ -->
<title>{{title}} · Frédéric (Fred) Blain</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<link rel="canonical" href="{{base}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{base}}">
<meta property="og:title" content="{{title}} · Frédéric (Fred) Blain">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{home}}/assets/photo-1200.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e2a3b'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='28' text-anchor='middle' fill='%23f4b860'%3EFB%3C/text%3E%3C/svg%3E">
<!-- Same light/dark choice as the homepage (same site, same storage) -->
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<!-- Fonts and icons come from the homepage's assets/ folder (same site, no third parties) -->
<link rel="stylesheet" href="{{home}}/assets/fonts/fonts.css">
<link rel="stylesheet" href="{{home}}/assets/fontawesome/css/all.min.css">
<style>
/* Same tokens as the homepage (fredblain.github.io/index.html) */
:root{
  --bg:#f4f6f7; --fg:#10222e; --muted:#3e5260; --sub:#5c7180; --line:#d5dee3; --card:#ffffff;
  --kicker:#8a5308; --link:#0b5a80; --link-h:#063b55;
  --hero:#0e2a3b; --hero-fg:#f3efe6; --hero-sub:#a9bfcc; --hero-line:#2f566d;
  --amber:#f4b860;
  --f-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter-l:max(20px,env(safe-area-inset-left,0px)); --gutter-r:max(20px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --fg:#e9eef1; --muted:#b4c3cc; --sub:#8fa4b1; --line:#23394a; --card:#122431;
  --kicker:#f4b860; --link:#8cc8e8; --link-h:#bfe2f4; --hero:#0a2130; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --fg:#e9eef1; --muted:#b4c3cc; --sub:#8fa4b1; --line:#23394a; --card:#122431;
  --kicker:#f4b860; --link:#8cc8e8; --link-h:#bfe2f4; --hero:#0a2130; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--f-display)}
a{color:var(--link);text-underline-offset:3px}a:hover{color:var(--link-h)}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}

/* Hero */
.hero{background:var(--hero);color:var(--hero-fg)}
.hero a{color:var(--amber)}.hero a:hover{color:#ffd59a}
.hero .wrap{padding-block:28px 56px;display:grid;gap:48px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px}
.crumb{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--hero-sub)}
.crumb a{color:var(--hero-sub);text-decoration:none}.crumb a:hover{color:var(--amber)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.top nav{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:15px}
.top nav a[aria-current="page"]{color:var(--hero-fg);text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:2px}
.btn{font:500 13px var(--f-mono);width:44px;height:44px;padding:0;border-radius:4px;cursor:pointer;border:1.5px solid var(--hero-line);background:transparent;color:var(--hero-fg);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.head{display:grid;gap:18px}
.head h1{margin:0;font-weight:800;font-size:clamp(52px,9vw,120px);line-height:.92;letter-spacing:-.035em}
.head p{margin:0;max-width:60ch;font-size:clamp(18px,2vw,21px);line-height:1.5;color:var(--hero-sub)}

/* List */
main .wrap{padding-block:64px 80px}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{display:grid;gap:10px;align-content:start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 24px}
.kicker{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kicker)}
.card h2{margin:0;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.card h2 a{color:var(--fg);text-decoration:none}
.card h2 a:hover{text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:2px}
.authors{margin:0;font-size:15px;color:var(--muted)}
.sum{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.tags li{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.acts{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.chip:first-child{background:var(--hero);border-color:var(--hero);color:var(--hero-fg)}
.chip:first-child:hover{background:var(--amber);border-color:var(--amber);color:#0e2a3b}
.empty{color:var(--muted)}

/* Footer */
footer{background:var(--hero);color:var(--hero-sub)}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-family:var(--f-mono);font-size:12px}
footer a{color:var(--hero-sub)}footer a:hover{color:var(--amber)}

@media (max-width:620px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px}
  main .wrap{padding-block:40px 56px}
  .hero .wrap{gap:36px}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top">
      <span class="crumb"><a href="{{home}}/">fredblain.github.io</a> / {{section}}</span>
      <div class="top-r">
        <nav aria-label="Main">
          <a href="{{home}}/">Home</a>
          <a href="{{home}}/edu/" data-section="edu">Teaching</a>
          <a href="{{home}}/res/" data-section="res">Research</a>
        </nav>
        <button type="button" class="btn" id="theme" aria-label="Switch theme"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="head">
      <h1>{{label}}</h1>
      <p>{{description}}</p>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <ul class="cards">
{{items}}
    </ul>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© {{year}} {{author}}</span>
    <a href="{{home}}/">← Back to the homepage</a>
  </div>
</footer>

<script>
// Mark the current section in the nav.
document.querySelectorAll('nav a[data-section="{{section}}"]').forEach(function(a){a.setAttribute("aria-current","page")});
// Light/dark toggle, shared with the homepage through localStorage("theme").
(function(){
  var btn=document.getElementById("theme"),root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
  function isDark(){var t=root.getAttribute("data-theme");return t?t==="dark":mq.matches}
  function paint(){btn.innerHTML='<i class="fa-solid '+(isDark()?"fa-sun":"fa-moon")+'" aria-hidden="true"></i>';btn.setAttribute("aria-label",isDark()?"Switch to light theme":"Switch to dark theme")}
  btn.addEventListener("click",function(){var t=isDark()?"light":"dark";root.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}paint()});
  paint();
})();
</script>
</body>
</html>
