<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Generated by build.py from templates/404.html. GitHub Pages serves it for any missing page under /{{section}}/. -->
<title>Page not found · Frédéric (Fred) Blain</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e2a3b'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='28' text-anchor='middle' fill='%23f4b860'%3EFB%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="{{home}}/assets/fonts/fonts.css">
<style>
:root{
  --hero:#0e2a3b; --hero-fg:#f3efe6; --hero-sub:#a9bfcc; --hero-line:#2f566d; --amber:#f4b860;
  --f-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#0a2130;color-scheme:dark}}
:root[data-theme="dark"]{--hero:#0a2130;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--hero);color:var(--hero-fg);font:400 17px/1.6 var(--f-display);padding:32px max(20px,env(safe-area-inset-left,0px))}
main{max-width:640px;display:grid;gap:20px}
.code{margin:0;font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--amber)}
h1{margin:0;font-weight:800;font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:-.03em}
p{margin:0;color:var(--hero-sub)}
code{font-family:var(--f-mono);font-size:.9em;color:var(--hero-fg);overflow-wrap:anywhere}
ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
a{color:var(--amber);text-underline-offset:3px}a:hover{color:#ffd59a}
a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.chip{font-family:var(--f-mono);font-size:13px;text-decoration:none;border:1.5px solid var(--hero-line);border-radius:4px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--amber)}
</style>
</head>
<body>
<main>
  <p class="code">404 · page not found</p>
  <h1>This page isn't here.</h1>
  <p>Nothing lives at <code id="path">this address</code>. It may have moved when the material was reorganised.</p>
  <ul>
    <li><a class="chip" href="{{base}}">Browse {{label}}</a></li>
    <li><a class="chip" href="{{home}}/">Homepage</a></li>
  </ul>
</main>
<script>document.getElementById("path").textContent=location.pathname</script>
</body>
</html>
